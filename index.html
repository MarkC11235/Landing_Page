<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Overwritten every minute by applySky() from the sun's position */
            --sky-top: #07070d;
            --sky-bottom: #0d0d16;
            --glow-1: 88, 80, 233;
            --glow-2: 59, 130, 246;
            --glow-alpha: 0.08;
            --accent: 99, 102, 241;
            --sun-x: 20%;
            --sun-y: 50%;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--sky-bottom);
            background-image:
                radial-gradient(ellipse at var(--sun-x) var(--sun-y), rgba(var(--glow-1), var(--glow-alpha)) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(var(--glow-2), calc(var(--glow-alpha) * 0.75)) 0%, transparent 50%),
                linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            background-attachment: fixed;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            min-height: 100vh;
            padding: 20px;
        }

        /* Stars, moon, clouds and precipitation are drawn here, behind the page */
        #sky {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        .time-date {
            font-size: 3.2em;
            text-align: center;
            margin: 50px 0 30px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 2px;
            text-shadow: 0 1px 14px rgba(0, 0, 0, 0.35);
        }

        #date {
            font-size: 0.5em;
            margin-top: 8px;
            opacity: 0.6;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 35px 0 50px;
            align-items: center;
        }

        .search-bar select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9em;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .search-bar select:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-bar input[type="text"] {
            flex: 1;
            max-width: 550px;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .search-bar input[type="text"]:focus {
            border-color: rgba(var(--accent), 0.6);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(var(--accent), 0.15);
        }

        .search-bar input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .section-title {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.55;
            margin: 30px 0 20px;
            padding-left: 5px;
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            padding: 25px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.25s ease;
            padding: 18px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            overflow-wrap: anywhere;
        }

        .logo-link:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* Light tile behind each icon so dark logos (GitHub etc.) stay visible
           on a dark page. No colour filter: icons keep their real colours. */
        .logo-tile {
            width: 52px;
            height: 52px;
            margin-bottom: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.94);
            display: grid;
            place-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s ease;
        }

        .logo-link:hover .logo-tile {
            transform: scale(1.06);
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .logo-fallback {
            font-size: 1.4em;
            font-weight: 600;
            color: #333;
        }

        .logo-link > span {
            font-size: 0.85em;
            opacity: 0.8;
            transition: opacity 0.25s ease;
        }

        .logo-link:hover > span {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .time-date {
                font-size: 2.4em;
            }
            
            .search-bar {
                flex-direction: column;
            }
            
            .search-bar input[type="text"] {
                max-width: 100%;
            }
            
            .logo-grid {
                grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="container">
        <div class="time-date">
            <div id="time"></div>
            <div id="date"></div>
        </div>

        <div class="search-bar">
            <select id="search-engine">
                <option value="https://www.google.com/search?q=" selected>Google</option>
                <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                <option value="https://search.brave.com/search?q=">Brave</option>
                <option value="https://www.bing.com/search?q=">Bing</option>
                <option value="https://search.yahoo.com/search?p=">Yahoo</option>
                <option value="https://ecosia.org?q=">Ecosia</option>
                <option value="https://www.startpage.com/do/search?q=">Startpage</option>
            </select>
            <input type="text" id="search-input" placeholder="Search the web..." autocomplete="off">
        </div>

        <div class="section-title">Favorites</div>
        <div class="logo-grid" id="logo-grid"></div>
    </div>

    <script>
        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query) {
                    const selected = document.getElementById('search-engine').value;
                    window.location.href = selected + encodeURIComponent(query);
                }
            }
        });

        document.getElementById('search-engine').addEventListener('change', function() {
            document.getElementById('search-input').focus();
        });

        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').textContent = now.toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ---- Time-of-day colours, driven by the sun's elevation ----
        // Coarse location, only used to work out sunrise/sunset. Change if you move.
        const LAT = 35.2, LON = -97.4;

        // Preview with ?t=HH:MM, ?d=YYYY-MM-DD and
        // ?w=clear|cloudy|overcast|rain|storm|snow|fog (e.g. index.html?t=21:00&d=2026-11-24&w=cloudy)
        const params = new URLSearchParams(location.search);
        function skyNow() {
            const t = params.get('t'), d = params.get('d');
            const now = new Date();
            if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) {
                const [y, mo, day] = d.split('-').map(Number);
                now.setFullYear(y, mo - 1, day);
            }
            if (t && /^\d{1,2}:\d{2}$/.test(t)) {
                const [h, m] = t.split(':').map(Number);
                now.setHours(h, m, 0, 0);
            }
            return now;
        }

        // NOAA approximation. Returns elevation in degrees and hour angle
        // (negative = morning, positive = afternoon).
        function sunPosition(date) {
            const rad = Math.PI / 180;
            const start = Date.UTC(date.getUTCFullYear(), 0, 0);
            const doy = Math.floor((date - start) / 864e5);
            const utcMin = date.getUTCHours() * 60 + date.getUTCMinutes();
            const g = 2 * Math.PI / 365 * (doy - 1 + (utcMin / 60 - 12) / 24);
            const eqTime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
                - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
            const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
                - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
                - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
            const solarMin = ((utcMin + eqTime + 4 * LON) % 1440 + 1440) % 1440;
            const hourAngle = solarMin / 4 - 180;
            const cosZenith = Math.sin(LAT * rad) * Math.sin(decl)
                + Math.cos(LAT * rad) * Math.cos(decl) * Math.cos(hourAngle * rad);
            const elevation = 90 - Math.acos(Math.max(-1, Math.min(1, cosZenith))) / rad;
            return { elevation, hourAngle };
        }

        // Colour stops keyed by sun elevation. Each: sky top, sky bottom,
        // glow 1, glow 2, accent (all RGB), glow strength.
        const NIGHT = [-14, [7, 7, 13], [13, 13, 22], [88, 80, 233], [59, 130, 246], [99, 102, 241], 0.08];
        const SKY = {
            am: [
                NIGHT,
                [-6, [16, 20, 48],  [44, 40, 84],    [120, 110, 230], [230, 130, 150], [140, 130, 240], 0.14],
                [0,  [36, 48, 98],  [150, 84, 104],  [255, 180, 120], [240, 130, 160], [255, 170, 130], 0.28],
                [8,  [28, 78, 134], [110, 130, 160], [255, 214, 140], [120, 180, 240], [250, 200, 120], 0.20],
                [25, [22, 84, 146], [58, 126, 180],  [255, 240, 190], [140, 200, 255], [130, 200, 255], 0.16]
            ],
            pm: [
                NIGHT,
                [-6, [20, 14, 44],  [58, 30, 72],    [170, 90, 200],  [240, 110, 90],  [190, 110, 220], 0.14],
                [0,  [44, 30, 84],  [168, 78, 58],   [255, 140, 70],  [220, 80, 140],  [255, 150, 90],  0.28],
                [8,  [30, 70, 124], [150, 116, 110], [255, 190, 110], [120, 160, 230], [255, 185, 110], 0.20],
                [25, [22, 84, 146], [58, 126, 180],  [255, 240, 190], [140, 200, 255], [130, 200, 255], 0.16]
            ]
        };

        // ---- Weather (Open-Meteo, no API key), moon, stars ----
        const animate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
        const sky = { elevation: 0, hourAngle: 0, glow: [255, 255, 255], moon: null };
        let weather = { cloud: 0, rain: 0, snow: 0, fog: 0, storm: false, wind: 15 };

        const WEATHER_PRESETS = {
            clear:    { cloud: 0 },
            cloudy:   { cloud: 0.5 },
            overcast: { cloud: 1 },
            rain:     { cloud: 0.95, rain: 0.7 },
            storm:    { cloud: 1, rain: 1, storm: true },
            snow:     { cloud: 0.9, snow: 0.7 },
            fog:      { cloud: 0.6, fog: 0.7 }
        };

        // WMO weather codes -> intensity 0..1
        const RAIN_CODES = { 51: .2, 53: .3, 55: .4, 56: .3, 57: .4, 61: .45, 63: .7, 65: 1, 66: .5, 67: .8,
                             80: .5, 81: .75, 82: 1, 95: .9, 96: 1, 99: 1 };
        const SNOW_CODES = { 71: .35, 73: .65, 75: 1, 77: .3, 85: .5, 86: 1 };

        function fromOpenMeteo(c) {
            const code = c.weather_code;
            const w = {
                cloud: (c.cloud_cover ?? 0) / 100,
                rain: RAIN_CODES[code] || 0,
                snow: SNOW_CODES[code] || 0,
                fog: code === 45 || code === 48 ? 0.7 : 0,
                storm: code >= 95
            };
            if (w.rain || w.snow) w.cloud = Math.max(w.cloud, 0.8);
            // Clouds drift with the real wind: direction is where it blows *from*.
            const from = (c.wind_direction_10m ?? 270) * Math.PI / 180;
            w.wind = (6 + (c.wind_speed_10m ?? 10) * 0.9) * (Math.sin(from) <= 0 ? 1 : -1);
            return w;
        }

        function setWeather(w) {
            weather = Object.assign({ cloud: 0, rain: 0, snow: 0, fog: 0, storm: false, wind: 15 }, w);
            applySky();
        }

        function loadWeather() {
            const preset = WEATHER_PRESETS[params.get('w')];
            if (preset) return setWeather(preset);
            try {
                const cached = JSON.parse(localStorage.getItem('weather') || 'null');
                if (cached && Date.now() - cached.ts < 15 * 60000) return setWeather(cached.w);
            } catch (e) {}
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
                + '&current=cloud_cover,weather_code,wind_speed_10m,wind_direction_10m')
                .then(res => res.json())
                .then(data => {
                    const w = fromOpenMeteo(data.current);
                    try { localStorage.setItem('weather', JSON.stringify({ ts: Date.now(), w })); } catch (e) {}
                    setWeather(w);
                })
                .catch(err => console.warn('Weather unavailable, showing a clear sky:', err));
        }

        // Low-precision lunar position (good to about a degree). Returns altitude,
        // hour angle, and phase: 0 = new, 0.25 = first quarter, 0.5 = full.
        function moonPosition(date) {
            const rad = Math.PI / 180, tau = 2 * Math.PI;
            const d = date / 864e5 - 10957.5;               // days since J2000
            const L = rad * (218.316 + 13.176396 * d);
            const M = rad * (134.963 + 13.064993 * d);
            const F = rad * (93.272 + 13.229350 * d);
            const lon = L + rad * 6.289 * Math.sin(M);
            const lat = rad * 5.128 * Math.sin(F);
            const e = rad * 23.4397;
            const ra = Math.atan2(Math.sin(lon) * Math.cos(e) - Math.tan(lat) * Math.sin(e), Math.cos(lon));
            const dec = Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon));
            const sidereal = rad * (280.16 + 360.9856235 * d) + rad * LON;
            let H = (sidereal - ra) % tau;
            if (H > Math.PI) H -= tau;
            if (H < -Math.PI) H += tau;
            const altitude = Math.asin(Math.sin(LAT * rad) * Math.sin(dec)
                + Math.cos(LAT * rad) * Math.cos(dec) * Math.cos(H)) / rad;
            const Ms = rad * (357.5291 + 0.98560028 * d);
            const sunLon = Ms + rad * (1.9148 * Math.sin(Ms) + 0.02 * Math.sin(2 * Ms)) + rad * 102.9372 + Math.PI;
            const phase = (((lon - sunLon) / tau) % 1 + 1) % 1;
            return { altitude, hourAngle: H / rad, phase };
        }

        const canvas = document.getElementById('sky');
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0;
        function resizeSky() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W * dpr; canvas.height = H * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            if (!animate) drawSky(0);
        }
        window.addEventListener('resize', resizeSky);

        // Seeded random so the star field and clouds are the same on every load.
        function seeded(seed) {
            return () => {
                seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        const rnd = seeded(11235);
        const clamp01 = v => Math.max(0, Math.min(1, v));

        const STARS = Array.from({ length: 220 }, () => ({
            x: rnd(), y: rnd(), r: 0.4 + rnd() * rnd() * 1.4,
            a: 0.35 + rnd() * 0.65, speed: 0.4 + rnd() * 1.6, phase: rnd() * 6.28
        }));

        // Clouds: four soft sprites, re-tinted as the light changes.
        const SPRITE_W = 520, SPRITE_H = 220;
        const SPRITES = Array.from({ length: 4 }, () => {
            const blobs = [];
            const n = 7 + Math.floor(rnd() * 4);
            for (let i = 0; i < n; i++) {           // flat base
                const t = i / (n - 1);
                blobs.push({ x: 80 + t * 360, y: 150 + rnd() * 8, r: 48 + rnd() * 18 });
            }
            for (let i = 0; i < n - 2; i++) {       // billows on top, tallest mid-cloud
                const t = (i + 0.5 + rnd() * 0.6 - 0.3) / (n - 2);
                blobs.push({ x: 120 + t * 280, y: 128 - Math.sin(t * Math.PI) * (15 + rnd() * 35), r: 50 + rnd() * 30 });
            }
            return { blobs, canvas: document.createElement('canvas') };
        });
        const CLOUDS = Array.from({ length: 14 }, (_, i) => ({
            sprite: i % 4, x: rnd(), y: Math.pow(rnd(), 1.4) * 0.5,
            scale: 0.7 + rnd() * 0.9, speed: 0.6 + rnd() * 0.8, off: 0
        }));
        // Shuffle the order clouds appear in as cover increases.
        CLOUDS.map((c, i) => [rnd(), i]).sort((p, q) => p[0] - q[0])
            .forEach(([, i], rank) => { CLOUDS[i].threshold = rank / CLOUDS.length; });

        let cloudColor = [255, 255, 255], cloudTint = '';
        function tintClouds() {
            const day = clamp01((sky.elevation + 6) / 14);
            const horizon = clamp01(1 - Math.abs(sky.elevation) / 10) * 0.45;
            const wet = 0.55 * Math.max(weather.rain, weather.snow * 0.4, clamp01((weather.cloud - 0.55) / 0.45) * 0.8);
            const night = [70, 76, 98], lit = [240, 244, 250], storm = [128, 134, 146];
            cloudColor = night.map((v, j) => {
                let c = v + (lit[j] - v) * day;
                c += (sky.glow[j] - c) * horizon;
                c += (storm[j] * (0.45 + 0.55 * day) - c) * wet;
                return Math.round(c);
            });
            if (cloudColor.join() === cloudTint) return;
            cloudTint = cloudColor.join();
            for (const s of SPRITES) {
                s.canvas.width = SPRITE_W; s.canvas.height = SPRITE_H;
                const c = s.canvas.getContext('2d');
                for (const b of s.blobs) {
                    const g = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
                    g.addColorStop(0, `rgba(${cloudTint}, 0.42)`);
                    g.addColorStop(1, `rgba(${cloudTint}, 0)`);
                    c.fillStyle = g;
                    c.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
                }
            }
        }

        const drops = [], flakes = [];
        let flash = 0, nextFlash = 4;

        function drawMoon() {
            const m = sky.moon;
            if (!m || m.altitude < -3) return;
            const lit = (1 - Math.cos(2 * Math.PI * m.phase)) / 2;
            const sunUp = clamp01((sky.elevation + 6) / 10);
            const alpha = clamp01((m.altitude + 3) / 6) * (1 - 0.55 * sunUp) * (1 - 0.75 * weather.cloud);
            if (alpha <= 0.01) return;
            const r = Math.max(18, Math.min(34, Math.min(W, H) * 0.04));
            const x = W * Math.max(0.06, Math.min(0.94, 0.5 + m.hourAngle / 90 * 0.42));
            const y = H * Math.max(0.09, 0.85 - m.altitude * 0.0085);
            // The lit limb points at the sun.
            let dHA = sky.hourAngle - m.hourAngle;
            dHA = ((dHA + 540) % 360) - 180;
            const angle = Math.atan2(-(sky.elevation - m.altitude) * 0.0085 * H, dHA / 90 * 0.42 * W);

            ctx.save();
            ctx.translate(x, y);
            if (sunUp < 1) {
                const halo = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, r * 4.5);
                halo.addColorStop(0, `rgba(220, 228, 255, ${0.16 * lit * alpha * (1 - sunUp)})`);
                halo.addColorStop(1, 'rgba(220, 228, 255, 0)');
                ctx.fillStyle = halo;
                ctx.fillRect(-r * 5, -r * 5, r * 10, r * 10);
            }
            ctx.rotate(angle);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(190, 200, 225, 0.10)';      // earthshine on the dark side
            ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
            ctx.fillStyle = 'rgb(246, 243, 230)';
            ctx.beginPath();
            ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2);
            ctx.ellipse(0, 0, r * Math.abs(Math.cos(2 * Math.PI * m.phase)), r, 0, Math.PI / 2, Math.PI * 1.5, lit < 0.5);
            ctx.fill();
            ctx.restore();
        }

        function drawSky(dt) {
            ctx.clearRect(0, 0, W, H);
            const t = performance.now() / 1000;

            // Stars fade in through twilight and hide behind cloud.
            const starLight = clamp01((-sky.elevation - 3) / 9) * (1 - 0.9 * weather.cloud) * (1 - weather.fog);
            if (starLight > 0.01) {
                ctx.fillStyle = '#fff';
                for (const s of STARS) {
                    const twinkle = animate ? 0.7 + 0.3 * Math.sin(t * s.speed + s.phase) : 1;
                    ctx.globalAlpha = starLight * s.a * twinkle;
                    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832); ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            drawMoon();

            // Clouds
            if (weather.cloud > 0.02) {
                const k = Math.max(0.7, Math.min(1.5, W / 1300));
                if (weather.cloud > 0.6) {
                    const veil = ctx.createLinearGradient(0, 0, 0, H);
                    const a = (weather.cloud - 0.6) / 0.4 * 0.22;
                    veil.addColorStop(0, `rgba(${cloudTint}, ${a})`);
                    veil.addColorStop(1, `rgba(${cloudTint}, ${a * 0.3})`);
                    ctx.fillStyle = veil; ctx.fillRect(0, 0, W, H);
                }
                for (const c of CLOUDS) {
                    const a = clamp01((weather.cloud - c.threshold) * CLOUDS.length);
                    if (a <= 0) continue;
                    const w = SPRITE_W * c.scale * k, h = SPRITE_H * c.scale * k;
                    const span = W + w;
                    c.off += dt * weather.wind * c.speed;
                    const x = (((c.x * span + c.off) % span) + span) % span - w;
                    ctx.globalAlpha = a * 0.85;
                    ctx.drawImage(SPRITES[c.sprite].canvas, x, c.y * H - h * 0.4, w, h);
                }
                ctx.globalAlpha = 1;
            }

            // Rain
            const area = W * H / 9e5;
            const wantDrops = Math.round(weather.rain * 260 * area);
            while (drops.length < wantDrops) drops.push({ x: Math.random(), y: Math.random(), z: 0.5 + Math.random() * 0.5 });
            drops.length = wantDrops;
            if (wantDrops) {
                const slant = Math.max(-0.5, Math.min(0.5, weather.wind / 80));
                ctx.strokeStyle = 'rgba(205, 222, 255, 0.38)';
                ctx.lineWidth = 1.1;
                ctx.beginPath();
                for (const d of drops) {
                    d.y += dt * (1.0 + 0.7 * d.z) * 1000 / H;
                    d.x += dt * slant * (1.0 + 0.7 * d.z) * 1000 / W;
                    if (d.y > 1) { d.y = -0.05; d.x = Math.random() * 1.4 - 0.2; }
                    const len = 12 + 16 * d.z;
                    ctx.moveTo(d.x * W, d.y * H);
                    ctx.lineTo(d.x * W - slant * len, d.y * H - len);
                }
                ctx.stroke();
            }

            // Snow
            const wantFlakes = Math.round(weather.snow * 190 * area);
            while (flakes.length < wantFlakes) flakes.push({ x: Math.random(), y: Math.random(), z: 0.3 + Math.random() * 0.7, p: Math.random() * 6.28 });
            flakes.length = wantFlakes;
            if (wantFlakes) {
                ctx.fillStyle = '#fff';
                for (const f of flakes) {
                    f.y += dt * (35 + 55 * f.z) / H;
                    f.x += dt * (weather.wind * 0.8 + Math.sin(t * 0.8 + f.p) * 14) / W;
                    if (f.y > 1) { f.y = -0.02; f.x = Math.random(); }
                    if (f.x > 1.02) f.x = -0.02; else if (f.x < -0.02) f.x = 1.02;
                    ctx.globalAlpha = 0.35 + 0.5 * f.z;
                    ctx.beginPath(); ctx.arc(f.x * W, f.y * H, 0.8 + 1.8 * f.z, 0, 6.2832); ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            // Fog
            if (weather.fog > 0) {
                const fog = ctx.createLinearGradient(0, 0, 0, H);
                fog.addColorStop(0, `rgba(${cloudTint}, ${weather.fog * 0.18})`);
                fog.addColorStop(1, `rgba(${cloudTint}, ${weather.fog * 0.5})`);
                ctx.fillStyle = fog; ctx.fillRect(0, 0, W, H);
            }

            // Lightning
            if (weather.storm && animate) {
                nextFlash -= dt;
                if (nextFlash <= 0) { flash = 1; nextFlash = 5 + Math.random() * 12; }
                if (flash > 0.01) {
                    ctx.fillStyle = `rgba(225, 232, 255, ${flash * 0.3})`;
                    ctx.fillRect(0, 0, W, H);
                    flash *= Math.pow(0.004, dt);
                }
            }
        }

        // 30fps is plenty for drifting clouds and twinkling stars; full rate only for precipitation.
        let lastFrame = 0;
        function frame(now) {
            requestAnimationFrame(frame);
            const precip = weather.rain || weather.snow;
            if (!precip && now - lastFrame < 32) return;
            const dt = Math.min(0.1, (now - lastFrame) / 1000);
            lastFrame = now;
            drawSky(dt);
        }

        function applySky() {
            const { elevation, hourAngle } = sunPosition(skyNow());
            const stops = hourAngle < 0 ? SKY.am : SKY.pm;
            const e = Math.max(stops[0][0], Math.min(stops[stops.length - 1][0], elevation));
            let i = 0;
            while (i < stops.length - 2 && e > stops[i + 1][0]) i++;
            const a = stops[i], b = stops[i + 1];
            const f = (e - a[0]) / (b[0] - a[0]);
            const mix = k => a[k].map((v, j) => Math.round(v + (b[k][j] - v) * f));

            // Cloud cover greys the sky out and mutes the sun's glow; rain darkens it.
            const grey = Math.max(0, Math.min(1, (weather.cloud - 0.3) / 0.7)) * 0.75;
            const dim = (1 - 0.28 * grey) * (1 - 0.2 * Math.max(weather.rain, weather.snow * 0.5));
            const overcast = c => {
                const l = 0.3 * c[0] + 0.55 * c[1] + 0.15 * c[2];
                const target = [l * 0.95, l * 1.0, l * 1.1];
                return c.map((v, j) => Math.round((v + (target[j] - v) * grey) * dim));
            };
            const top = overcast(mix(1)), bottom = overcast(mix(2)), glow1 = mix(3);

            const root = document.documentElement.style;
            root.setProperty('--sky-top', `rgb(${top})`);
            root.setProperty('--sky-bottom', `rgb(${bottom})`);
            root.setProperty('--glow-1', glow1.join(', '));
            root.setProperty('--glow-2', mix(4).join(', '));
            root.setProperty('--accent', mix(5).join(', '));
            const glowAlpha = (a[6] + (b[6] - a[6]) * f) * (1 - 0.7 * weather.cloud);
            root.setProperty('--glow-alpha', glowAlpha.toFixed(3));
            // The main glow follows the sun: left at sunrise, right at sunset.
            const x = Math.max(8, Math.min(92, 50 + hourAngle / 90 * 42));
            const y = Math.max(10, Math.min(100, 85 - elevation * 2));
            root.setProperty('--sun-x', x.toFixed(1) + '%');
            root.setProperty('--sun-y', y.toFixed(1) + '%');

            sky.elevation = elevation;
            sky.hourAngle = hourAngle;
            sky.glow = glow1;
            sky.moon = moonPosition(skyNow());
            tintClouds();
            if (!animate) drawSky(0);
        }

        resizeSky();
        applySky();
        setInterval(applySky, 60000);
        loadWeather();
        setInterval(loadWeather, 15 * 60000);
        if (animate) requestAnimationFrame(frame);

        fetch('sites.json')
            .then(res => res.json())
            .then(sites => {
                const grid = document.getElementById('logo-grid');
                sites.forEach(site => {
                    const link = document.createElement('a');
                    link.href = site.url;
                    link.className = 'logo-link';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';

                    // Optional "icon" in sites.json overrides the fetched favicon.
                    const domain = new URL(site.url).hostname;
                    const iconUrl = site.icon || `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                    const tile = document.createElement('div');
                    tile.className = 'logo-tile';

                    const img = document.createElement('img');
                    img.src = iconUrl;
                    img.className = 'logo-img';
                    img.alt = '';
                    img.onerror = () => {
                        const letter = document.createElement('span');
                        letter.className = 'logo-fallback';
                        letter.textContent = site.name.charAt(0).toUpperCase();
                        img.replaceWith(letter);
                    };
                    tile.appendChild(img);

                    const label = document.createElement('span');
                    label.textContent = site.name;

                    link.appendChild(tile);
                    link.appendChild(label);
                    grid.appendChild(link);
                });
            })
            .catch(err => {
                console.error('Failed to load sites:', err);
                document.getElementById('logo-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:0.5;padding:20px;">Failed to load sites. Check that sites.json exists.</p>';
            });
    </script>
</body>
</html>
