<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0d0d0d;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(88, 80, 233, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 50%);
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .time-date {
            font-size: 3.2em;
            text-align: center;
            margin: 50px 0 30px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 2px;
        }

        #date {
            font-size: 0.5em;
            margin-top: 8px;
            opacity: 0.6;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 35px 0 50px;
            align-items: center;
        }

        .search-bar select {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.9em;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .search-bar select:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-bar input[type="text"] {
            flex: 1;
            max-width: 550px;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            outline: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .search-bar input[type="text"]:focus {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-bar input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .section-title {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.4;
            margin: 30px 0 20px;
            padding-left: 5px;
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            padding: 25px;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.25s ease;
            padding: 18px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            overflow-wrap: anywhere;
        }

        .logo-link:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .logo-img {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
            filter: brightness(0) invert(0.85);
            opacity: 0.9;
            transition: all 0.25s ease;
        }

        .logo-link:hover .logo-img {
            opacity: 1;
            filter: brightness(0) invert(1);
        }

        .logo-link span {
            font-size: 0.85em;
            opacity: 0.7;
            transition: opacity 0.25s ease;
        }

        .logo-link:hover span {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .time-date {
                font-size: 2.4em;
            }
            
            .search-bar {
                flex-direction: column;
            }
            
            .search-bar input[type="text"] {
                max-width: 100%;
            }
            
            .logo-grid {
                grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="time-date">
            <div id="time"></div>
            <div id="date"></div>
        </div>

        <div class="search-bar">
            <select id="search-engine">
                <option value="https://www.google.com/search?q=" selected>Google</option>
                <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                <option value="https://search.brave.com/search?q=">Brave</option>
                <option value="https://www.bing.com/search?q=">Bing</option>
                <option value="https://search.yahoo.com/search?p=">Yahoo</option>
                <option value="https://ecosia.org?q=">Ecosia</option>
                <option value="https://www.startpage.com/do/search?q=">Startpage</option>
            </select>
            <input type="text" id="search-input" placeholder="Search the web..." autocomplete="off">
        </div>

        <div class="section-title">Favorites</div>
        <div class="logo-grid" id="logo-grid"></div>
    </div>

    <script>
        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query) {
                    const selected = document.getElementById('search-engine').value;
                    window.location.href = selected + encodeURIComponent(query);
                }
            }
        });

        document.getElementById('search-engine').addEventListener('change', function() {
            document.getElementById('search-input').focus();
        });

        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').textContent = now.toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        fetch('sites.json')
            .then(res => res.json())
            .then(sites => {
                const grid = document.getElementById('logo-grid');
                sites.forEach(site => {
                    const link = document.createElement('a');
                    link.href = site.url;
                    link.className = 'logo-link';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';

                    const domain = new URL(site.url).hostname;
                    const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

                    const img = document.createElement('img');
                    img.src = iconUrl;
                    img.className = 'logo-img';
                    img.alt = site.name;

                    const label = document.createElement('span');
                    label.textContent = site.name;

                    link.appendChild(img);
                    link.appendChild(label);
                    grid.appendChild(link);
                });
            })
            .catch(err => {
                console.error('Failed to load sites:', err);
                document.getElementById('logo-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:0.5;padding:20px;">Failed to load sites. Check that sites.json exists.</p>';
            });
    </script>
</body>
</html>
