<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #121212;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .time-date {
            font-size: 2.8em;
            text-align: center;
            margin: 40px 0;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            letter-spacing: 1px;
        }

        #date {
            font-size: 0.6em;
            margin-top: 10px;
            opacity: 0.8;
            font-weight: 300;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
        }

        .search-bar select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            cursor: pointer;
            outline: none;
        }

        .search-bar select:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar input[type="text"] {
            flex: 1;
            max-width: 500px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95em;
            outline: none;
        }

        .search-bar input[type="text"]:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-bar input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 25px;
            padding: 30px;
            margin: 20px 0 60px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }

        .logo-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.2s ease;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            overflow-wrap: anywhere;
        }

        .logo-link:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.05);
        }

        .logo-img {
            width: 50px;
            height: 50px;
            margin-bottom: 8px;
            filter: brightness(0) invert(0.9);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="time-date">
            <div id="time"></div>
            <div id="date"></div>
        </div>

        <div class="search-bar">
            <select id="search-engine">
                <option value="https://www.google.com/search?q=" selected>Google</option>
                <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
                <option value="https://search.brave.com/search?q=">Brave</option>
                <option value="https://www.bing.com/search?q=">Bing</option>
                <option value="https://search.yahoo.com/search?p=">Yahoo</option>
            </select>
            <input type="text" id="search-input" placeholder="Search the web..." autocomplete="off">
        </div>

        <div class="logo-grid" id="logo-grid"></div>
    </div>

    <script>
        const engines = {
            google: 'https://www.google.com/search?q=',
            duckduckgo: 'https://duckduckgo.com/?q=',
            brave: 'https://search.brave.com/search?q=',
            bing: 'https://www.bing.com/search?q=',
            yahoo: 'https://search.yahoo.com/search?p='
        };

        document.getElementById('search-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query) {
                    const selected = document.getElementById('search-engine').value;
                    window.location.href = selected + encodeURIComponent(query);
                }
            }
        });

        document.getElementById('search-engine').addEventListener('change', function() {
            document.getElementById('search-input').focus();
        });

        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').textContent = now.toLocaleDateString(undefined, {weekday: 'long', month: 'long', day: 'numeric'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        fetch('sites.json')
            .then(res => res.json())
            .then(sites => {
                const grid = document.getElementById('logo-grid');
                sites.forEach(site => {
                    const link = document.createElement('a');
                    link.href = site.url;
                    link.className = 'logo-link';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';

                    const img = document.createElement('img');
                    img.src = site.icon;
                    img.className = 'logo-img';
                    img.alt = site.name;
                    img.onerror = function() {
                        this.style.display = 'none';
                        const fallback = document.createElement('div');
                        fallback.style.cssText = 'width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:1.4em;font-weight:300;margin-bottom:8px;';
                        fallback.textContent = site.name.charAt(0).toUpperCase();
                        link.insertBefore(fallback, this);
                    };

                    const label = document.createElement('span');
                    label.textContent = site.name;

                    link.appendChild(img);
                    link.appendChild(label);
                    grid.appendChild(link);
                });
            })
            .catch(err => {
                console.error('Failed to load sites:', err);
                document.getElementById('logo-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:0.5;">Failed to load sites. Check that sites.json exists.</p>';
            });
    </script>
</body>
</html>
